<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>평택시 모바일 명함</title>
  <style>
    body {
      font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f3f4f6;
      margin: 0;
      padding: 15px;
    }
    
    /* 실제 명함 디자인 영역 */
    .biz-card {
      background-color: #fcfcf7; 
      width: 100%;
      max-width: 450px;
      border: 1px solid #e5e5e5;
      position: relative;
      padding: 20px 15px 25px 15px; /* 모바일에서도 잘리거나 밀리지 않게 여백 조정 */
      box-sizing: border-box;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      overflow: hidden;
    }
    
    /* 하단 파란색 띠 */
    .biz-card::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 12px;
      background-color: #1a5b8e;
    }

    /* 상단 로고 영역 */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      height: 35px;
    }
    .card-header img {
      height: 100%;
      object-fit: contain;
    }

    /* 본문 영역 (좌측 사진, 우측 텍스트) */
    .card-body {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    /* 좌측 사진 */
    .photo-area {
      flex: 0 0 95px; /* 스마트폰 너비에 맞춰 사진 크기 살짝 축소 */
    }
    .photo-area img {
      width: 100%;
      height: 125px;
      object-fit: contain;
      border: 1px solid #333;
      background-color: white;
    }

    /* 우측 정보 */
    .info-area {
      flex: 1;
      min-width: 0; /* 넘침 방지 */
    }
    .name-box {
      margin-bottom: 8px;
    }
    .name-box h1 {
      margin: 0 0 3px 0;
      font-size: 1.5rem;
      letter-spacing: 3px;
      color: #000;
      white-space: nowrap !important;
    }
    .name-box p {
      margin: 0;
      font-size: 0.85rem;
      color: #333;
      white-space: nowrap !important;
    }

    hr.divider {
      border: 0;
      border-top: 1px solid #666;
      margin: 8px 0;
    }

    /* 연락처 테이블 - 🌟 가장 중요한 수정 부분 🌟 */
    .contact-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem; /* 좁은 폰에서도 한 줄에 다 들어가도록 글자 크기 조정 */
      color: #333;
    }
    .contact-table th {
      text-align: left;
      font-weight: normal;
      width: 55px;
      padding: 2px 0;
      letter-spacing: 1px;
      white-space: nowrap !important; /* 글자가 세로로 찌그러지는 것 강제 방지 */
    }
    .contact-table td {
      padding: 2px 0;
      letter-spacing: -0.5px;
      white-space: nowrap !important; /* 주소가 두 줄로 떨어지는 것 강제 방지 */
    }

    /* 기능 버튼 및 QR 영역 */
    .action-area {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-sizing: border-box;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-align: center;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px 0;
      margin-bottom: 10px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 16px; /* 버튼 글자 크기 완벽 통일 */
      box-sizing: border-box;
    }
    .btn-save { background: #1a5b8e; color: white; }
    .btn-call { background: #e5e7eb; color: #1f2937; }
    
    .qr-image {
      margin-top: 15px;
      width: 120px;
      height: 120px;
    }
  </style>
</head>
<body>

  <!-- 1. 명함 디자인 영역 -->
  <div class="biz-card">
    <div class="card-header">
      <!-- 시청 로고 이미지가 들어갈 자리 (src 주소 변경 필요) -->
      <img src="logo.jpg" alt="평택시 로고">
      <img src="slo.jpg" alt="슬로건 로고">
    </div>
    
    <div class="card-body">
      <div class="photo-area">
        <!-- 평택이(프로필) 이미지가 들어갈 자리 (src 주소 변경 필요) -->
        <img src="pyeongtaeke.jpg" alt="프로필 사진" id="cardPhoto">
      </div>
      <div class="info-area">
        <div class="name-box">
          <h1 id="cardName">평 택 이</h1>
          <p id="cardRole">정보통신과 주무관</p>
        </div>
        <hr class="divider">
        <table class="contact-table">
          <tr><th>주 소</th><td id="cardAddress">경기도 평택시 경기대로 245(비전동)</td></tr>
          <tr><th>사무실</th><td id="cardOffice">031-8024-0000</td></tr>
          <tr><th>팩 스</th><td id="cardFax">031-8024-0001</td></tr>
          <tr><th>전화번호</th><td id="cardTel">010-0000-0000</td></tr>
          <tr><th>이 메 일</th><td id="cardEmail">jieun@korea.kr</td></tr>
        </table>
      </div>
    </div>
  </div>

  <!-- 2. 하단 조작 버튼 영역 -->
  <div class="action-area">
    <button class="btn btn-save" onclick="saveContact()">연락처 자동 저장</button>
    <a href="#" id="linkCall" class="btn btn-call">전화 걸기</a>
    <p style="font-size:0.8rem; color:#666; margin-top:20px;">▼ 카메라로 스캔하여 명함 저장 ▼</p>
    <img id="qrCodeImg" class="qr-image" src="" alt="QR Code">
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    
    const userData = {
      name: params.get('name') || '평 택 이',
      role: params.get('role') || '정보통신과 주무관',
      address: params.get('address') || '경기도 평택시 경기대로 245(비전동)',
      office: params.get('office') || '031-8024-0000',
      fax: params.get('fax') || '031-8024-0001',
      tel: params.get('tel') || '010-0000-0000',
      email: params.get('email') || 'pyeongtaeke@korea.kr'
    };

    document.getElementById('cardName').textContent = userData.name;
    document.getElementById('cardRole').textContent = userData.role;
    document.getElementById('cardAddress').textContent = userData.address;
    document.getElementById('cardOffice').textContent = userData.office;
    document.getElementById('cardFax').textContent = userData.fax;
    document.getElementById('cardTel').textContent = userData.tel;
    document.getElementById('cardEmail').textContent = userData.email;
    document.getElementById('linkCall').href = `tel:${userData.tel.replace(/[^0-9]/g, '')}`;

    const currentUrl = encodeURIComponent(window.location.href);
    document.getElementById('qrCodeImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${currentUrl}`;

    function saveContact() {
      const vcard = 
`BEGIN:VCARD
VERSION:3.0
N:${userData.name.replace(/ /g, '')};;;;
FN:${userData.name.replace(/ /g, '')}
ORG:평택시청;
TITLE:${userData.role}
ADR;TYPE=WORK:;;${userData.address};;;;
TEL;TYPE=WORK,VOICE:${userData.office}
TEL;TYPE=WORK,FAX:${userData.fax}
TEL;TYPE=CELL:${userData.tel}
EMAIL:${userData.email}
END:VCARD`;

      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const newLink = document.createElement('a');
      newLink.download = `${userData.name.replace(/ /g, '')}_명함.vcf`;
      newLink.href = url;
      newLink.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
