<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모바일 명함</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f3f4f6;
    }
    .card {
      background: white;
      padding: 2.2rem 1.8rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 320px;
      text-align: center;
      box-sizing: border-box;
    }
    .org {
      font-size: 0.85rem;
      font-weight: 700;
      color: #2563eb;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    .name {
      font-size: 1.6rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 0.3rem;
    }
    .role {
      color: #4b5563;
      font-size: 0.95rem;
      margin-bottom: 1.8rem;
    }
    .info-list {
      text-align: left;
      background: #f9fafb;
      padding: 0.9rem 1rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      font-size: 0.88rem;
      color: #374151;
      line-height: 1.6;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 0.85rem 0;
      margin-bottom: 0.75rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      text-align: center;
      border: none;
      cursor: pointer;
      box-sizing: border-box;
      transition: background-color 0.2s;
    }
    .btn-save {
      background: #2563eb;
      color: white;
    }
    .btn-save:active {
      background: #1d4ed8;
    }
    .btn-call {
      background: #e5e7eb;
      color: #1f2937;
    }
    .btn-call:active {
      background: #d1d5db;
    }
    .qr-box {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px dashed #e5e7eb;
    }
    .qr-title {
      font-size: 0.8rem;
      color: #6b7280;
      margin-bottom: 0.8rem;
    }
    .qr-image {
      width: 120px;
      height: 120px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      padding: 5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="org" id="cardOrg">소속 기관</div>
    <div class="name" id="cardName">이름</div>
    <div class="role" id="cardRole">직함</div>

    <div class="info-list">
      <div>📞 <span id="textTel">-</span></div>
      <div>✉️ <span id="textEmail">-</span></div>
    </div>
    
    <button class="btn btn-save" onclick="saveContact()">연락처 저장</button>
    <a href="#" id="linkCall" class="btn btn-call">전화 걸기</a>

    <!-- QR 코드 영역 추가 -->
    <div class="qr-box">
      <div class="qr-title">카메라로 스캔하여 명함 저장</div>
      <img id="qrCodeImg" class="qr-image" src="" alt="QR Code">
    </div>
  </div>

  <script>
    // 1. 주소창(URL)의 쿼리 파라미터 읽어오기
    const params = new URLSearchParams(window.location.search);

    // 파라미터가 없으면 표시할 기본값 설정
    const userData = {
      name: params.get('name') || '김지은',
      org: params.get('org') || '평택시청',
      role: params.get('role') || '기획예산과 주무관',
      tel: params.get('tel') || '010-0000-0000',
      email: params.get('email') || 'example@pyeongtaek.go.kr'
    };

    // 2. 화면 텍스트 실시간 반영
    document.getElementById('cardOrg').textContent = userData.org;
    document.getElementById('cardName').textContent = userData.name;
    document.getElementById('cardRole').textContent = userData.role;
    document.getElementById('textTel').textContent = userData.tel;
    document.getElementById('textEmail').textContent = userData.email;
    document.getElementById('linkCall').href = `tel:${userData.tel.replace(/[^0-9]/g, '')}`;

    // 3. 현재 접속 중인 전체 URL 주소를 가져와서 QR 코드 이미지 소스로 삽입
    const currentUrl = encodeURIComponent(window.location.href);
    document.getElementById('qrCodeImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${currentUrl}`;

    // 4. 동적 vCard 파일 생성 및 저장
    function saveContact() {
      const vcard = 
`BEGIN:VCARD
VERSION:3.0
N:${userData.name};;;;
FN:${userData.name}
ORG:${userData.org}
TITLE:${userData.role}
TEL;TYPE=CELL:${userData.tel}
EMAIL:${userData.email}
END:VCARD`;

      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const newLink = document.createElement('a');
      newLink.download = `${userData.name}_명함.vcf`;
      newLink.href = url;
      newLink.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
